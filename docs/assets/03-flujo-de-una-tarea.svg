<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1250" viewBox="0 0 920 1250" role="img" aria-label="Flujo de una tarea con verificación externa y aprobación"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.zt{font-size:13px;font-weight:700;letter-spacing:.6px;fill:#4A5568}.bt{font-size:15px;font-weight:700}.bs{font-size:12.5px}.lb{font-size:12.5px;fill:#1F2937}</style><title>Flujo de una tarea con verificación externa y aprobación</title><rect width="920" height="1250" fill="#ffffff"/><rect x="140.0" y="20" width="380" height="66" rx="10" fill="#FFF4DC" stroke="#9C6300" stroke-width="1.8"/><text x="330.0" y="49.0" class="bt" fill="#3A2600" text-anchor="middle">Persona</text><text x="330.0" y="67.0" class="bs" fill="#3A2600" text-anchor="middle">pide una tarea</text><rect x="140.0" y="126" width="380" height="76" rx="10" fill="#EAF0FB" stroke="#3B5BA9" stroke-width="1.8"/><text x="330.0" y="151.0" class="bt" fill="#091430" text-anchor="middle">Coordinador</text><text x="330.0" y="169.0" class="bs" fill="#091430" text-anchor="middle">clasifica y enruta (route.py recomienda)</text><text x="330.0" y="187.0" class="bs" fill="#091430" text-anchor="middle">la consigna no lleva datos reales</text><rect x="140.0" y="242" width="380" height="76" rx="10" fill="#EAF0FB" stroke="#3B5BA9" stroke-width="1.8"/><text x="330.0" y="267.0" class="bt" fill="#091430" text-anchor="middle">Builder · Codex</text><text x="330.0" y="285.0" class="bs" fill="#091430" text-anchor="middle">escribe código y pruebas con datos ficticios</text><text x="330.0" y="303.0" class="bs" fill="#091430" text-anchor="middle">entrega un resumen de hasta 60 líneas</text><rect x="140.0" y="358" width="380" height="66" rx="10" fill="#EAF0FB" stroke="#3B5BA9" stroke-width="1.8"/><text x="330.0" y="387.0" class="bt" fill="#091430" text-anchor="middle">Coordinador</text><text x="330.0" y="405.0" class="bs" fill="#091430" text-anchor="middle">revisa y prueba en un entorno aislado</text><rect x="120.0" y="464" width="420" height="190" rx="14" fill="#F3F6FC" stroke="#3B5BA9" stroke-width="1.5"/><text x="138.0" y="490" class="zt">VERIFICACIÓN POR MODELOS EXTERNOS</text><rect x="140.0" y="500" width="380" height="36" rx="10" fill="#EAF0FB" stroke="#3B5BA9" stroke-width="1.8"/><text x="330.0" y="523.0" class="bt" fill="#091430" text-anchor="middle">Pruebas de funcionamiento</text><rect x="140.0" y="546" width="380" height="36" rx="10" fill="#EAF0FB" stroke="#3B5BA9" stroke-width="1.8"/><text x="330.0" y="569.0" class="bt" fill="#091430" text-anchor="middle">Pruebas de visibilidad (qué queda expuesto)</text><rect x="140.0" y="592" width="380" height="36" rx="10" fill="#EAF0FB" stroke="#3B5BA9" stroke-width="1.8"/><text x="330.0" y="615.0" class="bt" fill="#091430" text-anchor="middle">Pruebas de seguridad</text><rect x="140.0" y="696" width="380" height="66" rx="10" fill="#EAF0FB" stroke="#3B5BA9" stroke-width="1.8"/><text x="330.0" y="725.0" class="bt" fill="#091430" text-anchor="middle">Coordinador</text><text x="330.0" y="743.0" class="bs" fill="#091430" text-anchor="middle">recibe y evalúa el resultado de las pruebas</text><polygon points="330,794.0 470.0,850 330,906.0 190.0,850" fill="#FFFFFF" stroke="#7B8799" stroke-width="1.8"/><text x="330" y="855" class="bt" fill="#3A4659" text-anchor="middle">¿Todo en orden?</text><rect x="140.0" y="940" width="380" height="66" rx="10" fill="#FFF4DC" stroke="#9C6300" stroke-width="1.8"/><text x="330.0" y="969.0" class="bt" fill="#3A2600" text-anchor="middle">Persona</text><text x="330.0" y="987.0" class="bs" fill="#3A2600" text-anchor="middle">revisa y aprueba</text><rect x="140.0" y="1046" width="380" height="76" rx="10" fill="#EAF0FB" stroke="#3B5BA9" stroke-width="1.8"/><text x="330.0" y="1071.0" class="bt" fill="#091430" text-anchor="middle">Coordinador</text><text x="330.0" y="1089.0" class="bs" fill="#091430" text-anchor="middle">publica el resultado aprobado</text><text x="330.0" y="1107.0" class="bs" fill="#091430" text-anchor="middle">y anota la bitácora</text><rect x="140.0" y="1162" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#7B8799" stroke-width="1.8"/><text x="330.0" y="1186.0" class="bt" fill="#3A4659" text-anchor="middle">Resultado publicado</text><text x="330.0" y="1204.0" class="bs" fill="#3A4659" text-anchor="middle">con registro de qué hizo cada IA</text><path d="M 330,86 L 330,126" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><path d="M 330,202 L 330,242" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><path d="M 330,318 L 330,358" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><path d="M 330,424 L 330,464" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><path d="M 330,654 L 330,696" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><path d="M 330,762 L 330,794" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><path d="M 330,906 L 330,940" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><path d="M 330,1006 L 330,1046" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><path d="M 330,1122 L 330,1162" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><rect x="336" y="665" width="175.60000000000002" height="20" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="340" y="678" class="lb" text-anchor="start">resultado de las pruebas</text><rect x="336" y="913" width="23.8" height="20" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="340" y="926" class="lb" text-anchor="start">Sí</text><path d="M 470,850 L 770,850 L 770,280 L 520.0,280" fill="none" stroke="#B45309" stroke-width="1.8" marker-end="url(#a)"/><rect x="778" y="547" width="106.60000000000001" height="52" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="782" y="560" class="lb" text-anchor="start">No: se corrige</text><text x="782" y="576" class="lb" text-anchor="start">y se repite el</text><text x="782" y="592" class="lb" text-anchor="start">ciclo completo</text><rect x="600" y="1166" width="22" height="16" rx="3" fill="#EAF0FB" stroke="#3B5BA9" stroke-width="1.5"/><text x="632" y="1179" class="bs" text-anchor="start" fill="#3A4659">Asistentes de IA (nube)</text><rect x="600" y="1192" width="22" height="16" rx="3" fill="#FFF4DC" stroke="#9C6300" stroke-width="1.5"/><text x="632" y="1205" class="bs" text-anchor="start" fill="#3A4659">La persona</text></svg>