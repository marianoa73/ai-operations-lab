<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="440" viewBox="0 0 1540 440" role="img" aria-label="Modelo propio: persona, HTTPS con Caddy, Kubernetes con Open WebUI, firewall y Ollama"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.zt{font-size:13px;font-weight:700;letter-spacing:.6px;fill:#4A5568}.bt{font-size:15px;font-weight:700}.bs{font-size:12.5px}.lb{font-size:12.5px;fill:#1F2937}</style><title>Modelo propio: persona, HTTPS con Caddy, Kubernetes con Open WebUI, firewall y Ollama</title><rect width="1540" height="440" fill="#ffffff"/><rect x="25" y="150" width="150" height="80" rx="10" fill="#FFF4DC" stroke="#9C6300" stroke-width="1.8"/><text x="100.0" y="186.0" class="bt" fill="#3A2600" text-anchor="middle">Persona</text><text x="100.0" y="204.0" class="bs" fill="#3A2600" text-anchor="middle">usa el chat</text><rect x="210" y="30" width="1305" height="385" rx="14" fill="#F4FAF6" stroke="#7FB59A" stroke-width="1.5"/><text x="228" y="56" class="zt">RED PROPIA</text><rect x="240" y="135" width="240" height="110" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="360.0" y="177.0" class="bt" fill="#0B2A1D" text-anchor="middle">Certificado HTTPS</text><text x="360.0" y="195.0" class="bs" fill="#0B2A1D" text-anchor="middle">Caddy: publicador</text><text x="360.0" y="213.0" class="bs" fill="#0B2A1D" text-anchor="middle">(proxy inverso)</text><rect x="540" y="85" width="310" height="210" rx="14" fill="#EEF8F2" stroke="#7FB59A" stroke-width="1.5"/><text x="558" y="283" class="zt">CLÚSTER KUBERNETES (K3S)</text><rect x="565" y="135" width="260" height="90" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="695.0" y="167.0" class="bt" fill="#0B2A1D" text-anchor="middle">Open WebUI</text><text x="695.0" y="185.0" class="bs" fill="#0B2A1D" text-anchor="middle">interfaz de chat</text><text x="695.0" y="203.0" class="bs" fill="#0B2A1D" text-anchor="middle">y consulta de documentos</text><rect x="905" y="150" width="160" height="80" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="985.0" y="177.0" class="bt" fill="#0B2A1D" text-anchor="middle">Firewall</text><text x="985.0" y="195.0" class="bs" fill="#0B2A1D" text-anchor="middle">sólo la interfaz</text><text x="985.0" y="213.0" class="bs" fill="#0B2A1D" text-anchor="middle">llega al modelo</text><rect x="1125" y="60" width="365" height="345" rx="14" fill="#EEF8F2" stroke="#7FB59A" stroke-width="1.5"/><text x="1143" y="393" class="zt">MODELOS · INTEL I5 · 32 GB · SIN GPU</text><path d="M 1307,225 L 1307,330" fill="none" stroke="#5A6577" stroke-width="1.8"/><rect x="1150" y="155" width="315" height="70" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="1307.5" y="186.0" class="bt" fill="#0B2A1D" text-anchor="middle">Ollama</text><text x="1307.5" y="204.0" class="bs" fill="#0B2A1D" text-anchor="middle">sirve los modelos</text><rect x="1150" y="240" width="315" height="56" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="1307.5" y="264.0" class="bt" fill="#0B2A1D" text-anchor="middle">Gemma 4 26B-A4B</text><text x="1307.5" y="282.0" class="bs" fill="#0B2A1D" text-anchor="middle">7 a 11 tokens por segundo</text><rect x="1150" y="316" width="315" height="56" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="1307.5" y="340.0" class="bt" fill="#0B2A1D" text-anchor="middle">Modelo de embeddings</text><text x="1307.5" y="358.0" class="bs" fill="#0B2A1D" text-anchor="middle">búsqueda en documentos</text><path d="M 175,190 L 240,190" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><rect x="184.75" y="163" width="44.5" height="20" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="207" y="176" class="lb" text-anchor="middle">HTTPS</text><path d="M 480,190 L 565,190" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><path d="M 825,190 L 905,190" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><path d="M 1065,190 L 1150,190" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><rect x="565" y="320" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#7B8799" stroke-width="1.8" stroke-dasharray="6 4"/><text x="695.0" y="351.0" class="bt" fill="#3A4659" text-anchor="middle">Colecciones de documentos</text><text x="695.0" y="369.0" class="bs" fill="#3A4659" text-anchor="middle">por proyecto (planificado)</text><path d="M 695,320 L 695,225" fill="none" stroke="#5A6577" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/></svg>