<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1015" viewBox="0 0 1200 1015" role="img" aria-label="Arquitectura general: coordinador, builder, auxiliar, persona y red propia"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.zt{font-size:13px;font-weight:700;letter-spacing:.6px;fill:#4A5568}.bt{font-size:15px;font-weight:700}.bs{font-size:12.5px}.lb{font-size:12.5px;fill:#1F2937}</style><title>Arquitectura general: coordinador, builder, auxiliar, persona y red propia</title><rect width="1200" height="1015" fill="#ffffff"/><rect x="30" y="20" width="1140" height="300" rx="14" fill="#F7F8FA" stroke="#9AA5B5" stroke-width="1.5"/><text x="48" y="46" class="zt">SERVICIOS DE TERCEROS (NUBE)</text><rect x="470" y="70" width="260" height="84" rx="10" fill="#EAF0FB" stroke="#3B5BA9" stroke-width="1.8"/><text x="600.0" y="108.0" class="bt" fill="#091430" text-anchor="middle">Coordinador · Claude</text><text x="600.0" y="126.0" class="bs" fill="#091430" text-anchor="middle">acceso real + revisión humana</text><rect x="110" y="210" width="300" height="84" rx="10" fill="#EAF0FB" stroke="#3B5BA9" stroke-width="1.8"/><text x="260.0" y="248.0" class="bt" fill="#091430" text-anchor="middle">Builder · Codex</text><text x="260.0" y="266.0" class="bs" fill="#091430" text-anchor="middle">sólo datos ficticios</text><rect x="790" y="210" width="300" height="84" rx="10" fill="#EAF0FB" stroke="#3B5BA9" stroke-width="1.8"/><text x="940.0" y="248.0" class="bt" fill="#091430" text-anchor="middle">Auxiliar · OpenRouter</text><text x="940.0" y="266.0" class="bs" fill="#091430" text-anchor="middle">sólo contenido público</text><path d="M 470,128 L 400,128 L 400,210" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><rect x="261.8" y="155" width="134.2" height="36" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="392" y="168" class="lb" text-anchor="end">consigna con datos</text><text x="392" y="184" class="lb" text-anchor="end">ficticios (tmux)</text><path d="M 180,210 L 180,92 L 470,92" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><rect x="230.3" y="73" width="189.4" height="20" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="325" y="86" class="lb" text-anchor="middle">código + resumen (archivo)</text><path d="M 730,128 L 800,128 L 800,210" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><rect x="804" y="155" width="120.4" height="36" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="808" y="168" class="lb" text-anchor="start">pregunta pública</text><text x="808" y="184" class="lb" text-anchor="start">corta (tmux)</text><path d="M 1020,210 L 1020,92 L 730,92" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><rect x="809.45" y="73" width="141.1" height="20" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="880" y="86" class="lb" text-anchor="middle">respuesta (archivo)</text><rect x="360" y="400" width="280" height="72" rx="10" fill="#FFF4DC" stroke="#9C6300" stroke-width="1.8"/><text x="500.0" y="432.0" class="bt" fill="#3A2600" text-anchor="middle">Persona</text><text x="500.0" y="450.0" class="bs" fill="#3A2600" text-anchor="middle">aprueba y decide los modelos</text><path d="M 500,400 L 500,154" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><rect x="387.4" y="352" width="106.60000000000001" height="20" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="490" y="365" class="lb" text-anchor="end">pide y aprueba</text><path d="M 560,154 L 560,400" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><rect x="566" y="345" width="92.80000000000001" height="36" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="570" y="358" class="lb" text-anchor="start">informa qué</text><text x="570" y="374" class="lb" text-anchor="start">hizo cada IA</text><rect x="30" y="520" width="1140" height="470" rx="14" fill="#F4FAF6" stroke="#7FB59A" stroke-width="1.5"/><text x="48" y="546" class="zt">RED PROPIA</text><rect x="900" y="570" width="240" height="80" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="1020.0" y="606.0" class="bt" fill="#0B2A1D" text-anchor="middle">Sistemas reales</text><text x="1020.0" y="624.0" class="bs" fill="#0B2A1D" text-anchor="middle">servidores · paneles · bases</text><path d="M 690,154 L 690,610 L 900,610" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><rect x="694" y="332" width="106.60000000000001" height="20" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="698" y="345" class="lb" text-anchor="start">prueba y opera</text><rect x="350" y="570" width="300" height="84" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="500.0" y="608.0" class="bt" fill="#0B2A1D" text-anchor="middle">Certificado HTTPS + Caddy</text><text x="500.0" y="626.0" class="bs" fill="#0B2A1D" text-anchor="middle">publicador (proxy inverso)</text><path d="M 500,472 L 500,570" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><rect x="506" y="479" width="127.30000000000001" height="36" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="510" y="492" class="lb" text-anchor="start">chat y documentos</text><text x="510" y="508" class="lb" text-anchor="start">internos</text><rect x="330" y="700" width="320" height="140" rx="14" fill="#EEF8F2" stroke="#7FB59A" stroke-width="1.5"/><text x="348" y="828" class="zt">CLÚSTER KUBERNETES (K3S)</text><path d="M 500,654 L 500,735" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><rect x="355" y="735" width="270" height="72" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="490.0" y="767.0" class="bt" fill="#0B2A1D" text-anchor="middle">Open WebUI</text><text x="490.0" y="785.0" class="bs" fill="#0B2A1D" text-anchor="middle">interfaz de chat y documentos</text><rect x="700" y="735" width="170" height="72" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="785.0" y="758.0" class="bt" fill="#0B2A1D" text-anchor="middle">Firewall</text><text x="785.0" y="776.0" class="bs" fill="#0B2A1D" text-anchor="middle">el puerto del modelo</text><text x="785.0" y="794.0" class="bs" fill="#0B2A1D" text-anchor="middle">sólo acepta la interfaz</text><rect x="910" y="700" width="240" height="280" rx="14" fill="#EEF8F2" stroke="#7FB59A" stroke-width="1.5"/><text x="928" y="968" class="zt">SERVIDOR DE MODELOS</text><path d="M 1030,801 L 1030,890" fill="none" stroke="#5A6577" stroke-width="1.8"/><rect x="930" y="735" width="200" height="66" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="1030.0" y="764.0" class="bt" fill="#0B2A1D" text-anchor="middle">Ollama</text><text x="1030.0" y="782.0" class="bs" fill="#0B2A1D" text-anchor="middle">sirve los modelos</text><rect x="930" y="820" width="200" height="56" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="1030.0" y="844.0" class="bt" fill="#0B2A1D" text-anchor="middle">Gemma 4 26B-A4B</text><text x="1030.0" y="862.0" class="bs" fill="#0B2A1D" text-anchor="middle">respuestas</text><rect x="930" y="890" width="200" height="56" rx="10" fill="#E8F5EE" stroke="#2E7D5B" stroke-width="1.8"/><text x="1030.0" y="914.0" class="bt" fill="#0B2A1D" text-anchor="middle">Modelo de embeddings</text><text x="1030.0" y="932.0" class="bs" fill="#0B2A1D" text-anchor="middle">búsqueda en documentos</text><path d="M 625,771 L 700,771" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/><path d="M 870,771 L 930,771" fill="none" stroke="#5A6577" stroke-width="1.8" marker-end="url(#a)"/></svg>